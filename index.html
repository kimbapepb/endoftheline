const N=100,M=90,S=8,pass=new Uint8Array(N*M);

function point(id){return [id%N*S+4,Math.floor(id/N)*S+4]}
function cell(x,y){let best=-1,d=Infinity;const col=Math.floor(x/S),row=Math.floor(y/S);
 for(let j=Math.max(0,row-6);j<Math.min(M,row+7);j++)for(let i=Math.max(0,col-6);i<Math.min(N,col+7);i++){const id=j*N+i,k=(i*S+4-x)**2+(j*S+4-y)**2;if(pass[id]&&k<d){best=id;d=k}}return best}
function route(x,y,tx,ty){let start=cell(x,y),end=cell(tx,ty);if(start<0||end<0)return [];const prev=new Int16Array(N*M).fill(-1),queue=[start];prev[start]=start;
